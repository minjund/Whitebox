name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm run check:source
      - run: npm test
      - run: npm run test:accuracy
      - run: npm run test:performance
      - name: Verify renderer profile recovery and idempotence
        run: npm run test:brand-profile-recovery
      - name: Verify cross-version profile locking
        run: npm run test:interim-profile-guard
      - name: Verify visible Whitebox name and icons
        run: npm run test:brand-surface
      - name: Verify completed-result review persistence
        run: npm run test:result-review
      - run: npm audit --audit-level=high
      - run: npm run test:terminal
      - name: Verify Korean terminal composition
        if: runner.os == 'Windows'
        run: npm run test:terminal:ime
      - run: npm run test:terminal:startup
      - run: npm run test:terminal:tmux-pane
      - run: npm run test:bridge
      - name: Verify inline PTY interaction contract
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-conversation
      - name: Verify inline actual PTY end to end
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-actual-pty
      - name: Upload drawer conversation diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Diagnostics-drawer-conversation-${{ github.run_attempt }}
          path: |
            artifacts/drawer-terminal-visual.log
            artifacts/inline-actual-pty-integration.log
            artifacts/pty-focus-actual-pty-integration.log
            artifacts/whitebox-pty-focus-actual-pty-failure.png
            artifacts/whitebox-drawer-*.png
            artifacts/whitebox-inline-*.png
            artifacts/whitebox-history-empty.png
          if-no-files-found: ignore
      - if: runner.os == 'macOS'
        run: npm run test:terminal:mac-stress
      - if: runner.os == 'macOS'
        run: npm run test:tmux -- macOS
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run check:package

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: critical

  mac-arm64-update:
    needs: mac-artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Whitebox-macOS
          path: release
      - run: |
          test "$(node -p process.arch)" = arm64
          version="$(node -p 'require("./package.json").version')"
          ditto -x -k "release/Whitebox-$version-arm64.zip" release/mac-arm64
          node scripts/mac-update-cohort-check.js

  mac-artifacts:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run test:artifacts:mac
      - run: node scripts/mac-update-cohort-check.js
      - run: npm run test:terminal-restart
        env:
          WHITEBOX_TEST_EXECUTABLE: ${{ github.workspace }}/release/mac/Whitebox.app/Contents/MacOS/Whitebox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Whitebox-macOS
          path: |
            release/*.dmg
            release/*.zip
