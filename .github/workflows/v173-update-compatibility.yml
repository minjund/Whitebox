name: Windows Frozen-Client Update Compatibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Whitebox commit SHA to build and verify from the official v1.7.3, v1.7.4, and fixed v1.7.5 installers
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-frozen-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify updater-sensitive changes
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.changes.outputs.sensitive }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Classify the complete event diff before path filtering
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
            echo "Manual verification always runs the full compatibility gate."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA^..$HEAD_SHA"
          fi

          git diff --name-status --no-renames "$range" > "$RUNNER_TEMP/whitebox-changed-files.txt"
          node scripts/updater-review-scope.js < "$RUNNER_TEMP/whitebox-changed-files.txt" > "$RUNNER_TEMP/whitebox-updater-scope.json"
          sensitive="$(node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(typeof value.sensitive!=='boolean')process.exit(2);process.stdout.write(String(value.sensitive));" "$RUNNER_TEMP/whitebox-updater-scope.json")"
          echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
          echo "Updater-sensitive: $sensitive"
          cat "$RUNNER_TEMP/whitebox-updater-scope.json"

  verify_windows_update:
    name: Frozen-client packaged E2E
    needs: classify
    if: ${{ needs.classify.outputs.sensitive == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      - name: Verify the explicitly pinned source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be a full 40-character commit SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()) { throw "Checked out $actual instead of $env:EXPECTED_SOURCE_SHA" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - name: Build the exact Windows release candidate
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows release artifacts
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: "true"
      - name: Download the pinned official Whitebox v1.7.3, v1.7.4, and v1.7.5 installers
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'whitebox-frozen-source'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/minjund/Whitebox/releases/download/v1.7.3/Whitebox-Setup-1.7.3.exe' -OutFile (Join-Path $sourceDir 'Whitebox-Setup-1.7.3.exe')
          Invoke-WebRequest -Uri 'https://github.com/minjund/Whitebox/releases/download/v1.7.4/Whitebox-Setup-1.7.4.exe' -OutFile (Join-Path $sourceDir 'Whitebox-Setup-1.7.4.exe')
          Invoke-WebRequest -Uri 'https://github.com/minjund/Whitebox/releases/download/v1.7.5/Whitebox-Setup-1.7.5.exe' -OutFile (Join-Path $sourceDir 'Whitebox-Setup-1.7.5.exe')
          function Assert-PinnedInstaller([string]$Path, [long]$ExpectedSize, [string]$ExpectedSha256) {
            $item = Get-Item -LiteralPath $Path
            if ($item.Length -ne $ExpectedSize) { throw "Pinned installer size mismatch for $Path`: $($item.Length)" }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $ExpectedSha256) { throw "Pinned installer SHA-256 mismatch for $Path`: $actualSha256" }
          }
          Assert-PinnedInstaller (Join-Path $sourceDir 'Whitebox-Setup-1.7.3.exe') 85295741 '6b14caec7baeca5d6048c32121b9d7361f2bd56828aa6228f2322bf32da6f574'
          Assert-PinnedInstaller (Join-Path $sourceDir 'Whitebox-Setup-1.7.4.exe') 85296425 '4d940cf16425436922a37746417b419c7671c47642c0f24b8c79197af99c2135'
          Assert-PinnedInstaller (Join-Path $sourceDir 'Whitebox-Setup-1.7.5.exe') 85297926 '3455b7c9aa9e7c520774995694dbcdb71678a0280a0fde2040693a00d38f2e68'
          $targetVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $targetInstaller = (Resolve-Path -LiteralPath "release/Whitebox-Setup-$targetVersion.exe").Path
          $manualInstaller = Join-Path (Split-Path -Parent $targetInstaller) "Whitebox-Manual-Setup-$targetVersion-x64.exe"
          Copy-Item -LiteralPath $targetInstaller -Destination $manualInstaller -Force
          if ((Get-Item -LiteralPath $targetInstaller).Length -ne (Get-Item -LiteralPath $manualInstaller).Length) { throw 'Manual bridge installer size differs from canonical Setup' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $targetInstaller).Hash -cne (Get-FileHash -Algorithm SHA256 -LiteralPath $manualInstaller).Hash) { throw 'Manual bridge installer digest differs from canonical Setup' }
          "WHITEBOX_V173_INSTALLER=$(Join-Path $sourceDir 'Whitebox-Setup-1.7.3.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_V174_INSTALLER=$(Join-Path $sourceDir 'Whitebox-Setup-1.7.4.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_V175_INSTALLER=$(Join-Path $sourceDir 'Whitebox-Setup-1.7.5.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER=$targetInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_MANUAL_INSTALLER=$manualInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify frozen v1.7.3 and corrected target bootstrap (attempt 1)
        timeout-minutes: 10
        run: npm run test:update:win:frozen
        env:
          WHITEBOX_FROZEN_VERSION: 1.7.3
      - name: Verify frozen v1.7.4 and corrected target bootstrap (attempt 2)
        timeout-minutes: 10
        run: npm run test:update:win:frozen
        env:
          WHITEBOX_FROZEN_VERSION: 1.7.4
      - name: Verify fixed v1.7.5 canonical update and target bootstrap (attempt 3)
        timeout-minutes: 10
        run: npm run test:update:win:frozen
        env:
          WHITEBOX_FROZEN_VERSION: 1.7.5

  compatibility_gate:
    name: Updater compatibility gate
    needs: [classify, verify_windows_update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the packaged E2E for every sensitive diff
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SENSITIVE: ${{ needs.classify.outputs.sensitive }}
          VERIFY_RESULT: ${{ needs.verify_windows_update.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification failed."
            exit 1
          fi
          case "$SENSITIVE" in
            true|false) ;;
            *)
              echo "Change classification returned an invalid sensitivity value: ${SENSITIVE:-<empty>}"
              exit 1 ;;
          esac
          if [ "$SENSITIVE" = "true" ] && [ "$VERIFY_RESULT" != "success" ]; then
            echo "Updater-sensitive changes require the frozen-client packaged E2E. Result: $VERIFY_RESULT"
            exit 1
          fi
          echo "Updater compatibility gate passed (sensitive=$SENSITIVE, packaged-e2e=$VERIFY_RESULT)."
