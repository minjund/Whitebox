name: Windows v1.7.3 Update Compatibility

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Whitebox commit SHA to build and verify from the official v1.7.3 installer
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify_windows_update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Verify the explicitly pinned source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be a full 40-character commit SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()) { throw "Checked out $actual instead of $env:EXPECTED_SOURCE_SHA" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - name: Build the exact Windows release candidate
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows release artifacts
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: "true"
      - name: Download the pinned official Whitebox v1.7.3 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'whitebox-v173-source'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          gh release download v1.7.3 --repo minjund/Whitebox --pattern Whitebox-Setup-1.7.3.exe --dir $sourceDir
          $targetVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $targetInstaller = (Resolve-Path -LiteralPath "release/Whitebox-Setup-$targetVersion.exe").Path
          "WHITEBOX_V173_INSTALLER=$(Join-Path $sourceDir 'Whitebox-Setup-1.7.3.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER=$targetInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify v1.7.3 replacement and corrected bootstrap acknowledgement
        timeout-minutes: 10
        run: npm run test:update:win:v173
