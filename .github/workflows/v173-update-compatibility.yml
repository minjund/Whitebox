name: Windows Frozen-Client Update Compatibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA to verify frozen 1.7.3-1.7.5, previous fixed, legacy bridge, and candidate self-reinstall paths
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-frozen-update-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify updater-sensitive changes
    runs-on: ubuntu-latest
    outputs:
      cohort_manifest: ${{ steps.public_latest.outputs.cohort_manifest }}
      sensitive: ${{ steps.changes.outputs.sensitive }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify previousFixed matches the public latest stable release
        id: public_latest
        shell: bash
        run: |
          npm run check:update:cohorts
          cohort_manifest="$(node -e "const {readCohortManifest}=require('./scripts/check-update-compatibility-cohorts');process.stdout.write(JSON.stringify(readCohortManifest()));")"
          if [ -z "$cohort_manifest" ]; then
            echo "Validated cohort manifest attestation was empty."
            exit 1
          fi
          printf 'cohort_manifest=%s\n' "$cohort_manifest" >> "$GITHUB_OUTPUT"
      - name: Classify the complete event diff before path filtering
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
            echo "Manual verification always runs the full compatibility gate."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA^..$HEAD_SHA"
          fi

          git diff --name-status --no-renames "$range" > "$RUNNER_TEMP/whitebox-changed-files.txt"
          node scripts/updater-review-scope.js < "$RUNNER_TEMP/whitebox-changed-files.txt" > "$RUNNER_TEMP/whitebox-updater-scope.json"
          sensitive="$(node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(typeof value.sensitive!=='boolean')process.exit(2);process.stdout.write(String(value.sensitive));" "$RUNNER_TEMP/whitebox-updater-scope.json")"
          echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
          echo "Updater-sensitive: $sensitive"
          cat "$RUNNER_TEMP/whitebox-updater-scope.json"

  build_windows_candidate:
    name: Build Windows updater candidate
    needs: classify
    if: ${{ needs.classify.outputs.sensitive == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      - name: Verify the explicitly pinned source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be a full 40-character commit SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()) { throw "Checked out $actual instead of $env:EXPECTED_SOURCE_SHA" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind the selected commit to the unauthenticated public-latest attestation
        shell: pwsh
        env:
          EXPECTED_COHORT_MANIFEST: ${{ needs.classify.outputs.cohort_manifest }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_COHORT_MANIFEST)) {
            throw 'The unauthenticated public-latest cohort attestation was missing'
          }
          $actualManifest = (& node -e "const {readCohortManifest}=require('./scripts/check-update-compatibility-cohorts');process.stdout.write(JSON.stringify(readCohortManifest()));")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to validate the selected compatibility cohort manifest' }
          if ($actualManifest -cne $env:EXPECTED_COHORT_MANIFEST) {
            throw 'The selected compatibility cohort manifest differs from the public-latest validated manifest'
          }
          Write-Host 'Selected cohort manifest matches the unauthenticated public-latest attestation.'
      - run: npm run check:source
      - run: npm test
      - name: Build the exact Windows release candidate
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows release artifacts
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: "true"
      - name: Verify packaged Windows Authenticode checks
        run: node scripts/windows-signature-verification-check.js
      - name: Pin one candidate build and the complete shard plan
        run: node scripts/windows-update-shards.js create
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          EXPECTED_COHORT_MANIFEST: ${{ needs.classify.outputs.cohort_manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-update-candidate
          path: release/*.exe
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-update-plan-${{ github.run_attempt }}
          path: artifacts/windows-update-plan/plan.json
          if-no-files-found: error

  verify_windows_update:
    name: Frozen-client packaged E2E
    needs: [classify, build_windows_candidate]
    if: ${{ needs.classify.outputs.sensitive == 'true' }}
    uses: ./.github/workflows/windows-update-shards.yml
    with:
      source_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      candidate_artifact: Windows-update-candidate
      plan_artifact: Windows-update-plan-${{ github.run_attempt }}

  compatibility_gate:
    name: Updater compatibility gate
    needs: [classify, build_windows_candidate, verify_windows_update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the packaged E2E for every sensitive diff
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SENSITIVE: ${{ needs.classify.outputs.sensitive }}
          VERIFY_RESULT: ${{ needs.verify_windows_update.result }}
          COVERAGE_VERIFIED: ${{ needs.verify_windows_update.outputs.verified }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification failed."
            exit 1
          fi
          case "$SENSITIVE" in
            true|false) ;;
            *)
              echo "Change classification returned an invalid sensitivity value: ${SENSITIVE:-<empty>}"
              exit 1 ;;
          esac
          if [ "$SENSITIVE" = "true" ] && { [ "$VERIFY_RESULT" != "success" ] || [ "$COVERAGE_VERIFIED" != "true" ]; }; then
            echo "Updater-sensitive changes require the frozen-client packaged E2E. Result: $VERIFY_RESULT"
            exit 1
          fi
          echo "Updater compatibility gate passed (sensitive=$SENSITIVE, packaged-e2e=$VERIFY_RESULT)."
