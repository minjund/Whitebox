name: Windows 2.0.1 serial stall diagnostic (not a release gate)
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable main commit to diagnose; no release approval
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    name: Diagnostic only - original first3 serial cohorts
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      - name: Verify the explicitly pinned source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be a full 40-character commit SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()) { throw "Checked out $actual instead of $env:EXPECTED_SOURCE_SHA" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - name: Build the exact Windows release candidate
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows release artifacts
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: 'true'
      - name: Verify packaged Windows Authenticode checks
        run: node scripts/windows-signature-verification-check.js
      - name: Download every installer pinned by the compatibility cohort manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'scripts/update-compatibility-cohorts.json' -Raw | ConvertFrom-Json
          if (@($manifest.frozen).Count -ne 3 -or $null -eq $manifest.previousFixed) {
            throw 'Compatibility cohort manifest must contain three frozen source cohorts and one previousFixed attestation'
          }
          $cohorts = @(node -e "const c=require('./scripts/check-update-compatibility-cohorts');process.stdout.write(JSON.stringify(c.cohortList(c.readCohortManifest())));" | ConvertFrom-Json)
          if ($cohorts.Count -lt 7) { throw "Expected frozen and recent compatibility cohorts, found $($cohorts.Count)" }
          $sourceDir = Join-Path $env:RUNNER_TEMP 'whitebox-frozen-source'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          function Assert-PinnedInstaller([string]$Path, [long]$ExpectedSize, [string]$ExpectedSha256) {
            $item = Get-Item -LiteralPath $Path
            if ($item.Length -ne $ExpectedSize) { throw "Pinned installer size mismatch for $Path`: $($item.Length)" }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $ExpectedSha256) { throw "Pinned installer SHA-256 mismatch for $Path`: $actualSha256" }
          }
          foreach ($cohort in $cohorts) {
            $uri = [Uri][string]$cohort.url
            $installerName = [System.IO.Path]::GetFileName($uri.AbsolutePath)
            $installerPath = Join-Path $sourceDir $installerName
            $environmentName = [string]$cohort.env
            if ($environmentName -notmatch '^WHITEBOX_V[0-9]+_INSTALLER$') {
              throw "Unsafe compatibility cohort environment name: $environmentName"
            }
            Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $installerPath
            Assert-PinnedInstaller $installerPath ([long]$cohort.size) ([string]$cohort.sha256)
            "$environmentName=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $targetVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $targetInstaller = (Resolve-Path -LiteralPath "release/Whitebox-Setup-$targetVersion.exe").Path
          $manualInstaller = Join-Path (Split-Path -Parent $targetInstaller) "Whitebox-Manual-Setup-$targetVersion-x64.exe"
          Copy-Item -LiteralPath $targetInstaller -Destination $manualInstaller -Force
          if ((Get-Item -LiteralPath $targetInstaller).Length -ne (Get-Item -LiteralPath $manualInstaller).Length) { throw 'Manual bridge installer size differs from canonical Setup' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $targetInstaller).Hash -cne (Get-FileHash -Algorithm SHA256 -LiteralPath $manualInstaller).Hash) { throw 'Manual bridge installer digest differs from canonical Setup' }
          $targetSize = (Get-Item -LiteralPath $targetInstaller).Length
          $targetSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $targetInstaller).Hash.ToLowerInvariant()
          "WHITEBOX_CURRENT_INSTALLER=$targetInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_MANUAL_INSTALLER=$manualInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER_SIZE=$targetSize" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER_SHA256=$targetSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_LEGACY_CANDIDATE_E2E=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Add test-only stage traces after packaging immutable product bytes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const file = process.env.WHITEBOX_DIAGNOSTIC_DRIVER_PATH || 'scripts/windows-v173-update-integration.js';
          let source = fs.readFileSync(file, 'utf8');
          const digest = value => crypto.createHash('sha256').update(value).digest('hex');
          console.log('DIAG original driver sha256=' + digest(source));
          source = source.replace(/\r\n/g, '\n');
          console.log('DIAG unchanged product updater sha256=' + digest(fs.readFileSync('src/updateInstaller.js')));
          function once(before, after) {
            if (source.split(before).length !== 2) throw new Error('Diagnostic patch was not unique: ' + before);
            source = source.replace(before, after);
          }
          once("function run(command, args, options = {}) {", `function run(command, args, options = {}) {
            console.log('DIAG_SYNC_BEGIN', new Date().toISOString(), path.basename(command), new Error().stack.split('\\n').slice(2, 5).join(' | '));`);
          once("    ...options,\n  });\n  if (result.error || result.status !== 0) {", `    ...options,
            });
            console.log('DIAG_SYNC_END', new Date().toISOString(), path.basename(command), result.status, result.error?.code || '');
            if (result.error || result.status !== 0) {`);
          once("async function launchPackagedInstaller(installerModule, options) {", `async function launchPackagedInstaller(installerModule, options) {
            console.log('DIAG_LAUNCH_BEGIN', new Date().toISOString(), options.downloadsDir, options.parentPid);`);
          once("  assert.equal(helperCallbackCount, 1, 'The packaged updater did not cross its helper-ready boundary exactly once.');", `  console.log('DIAG_LAUNCH_RETURNED', new Date().toISOString(), helperPid);
            assert.equal(helperCallbackCount, 1, 'The packaged updater did not cross its helper-ready boundary exactly once.');`);
          once("    bootstrapChild = spawn(command, args, spawnOptions);", `    console.log('DIAG_BOOTSTRAP_SPAWN_BEGIN', new Date().toISOString());
              bootstrapChild = spawn(command, args, spawnOptions);
              console.log('DIAG_BOOTSTRAP_SPAWN_RETURNED', new Date().toISOString(), bootstrapChild.pid);`);
          once("      helperCallbackCount += 1;", `      console.log('DIAG_HELPER_CALLBACK_BEGIN', new Date().toISOString());
                helperCallbackCount += 1;`);
          once("  const reinstallParentPid = activeAppPid;", `  console.log('DIAG_REINSTALL_STAGE', new Date().toISOString(), activeAppPid);
            const reinstallParentPid = activeAppPid;`);
          once("    closeInstalledAppGracefully(reinstallParentPid);", `    console.log('DIAG_CLOSE_PARENT_BEGIN', new Date().toISOString());
              closeInstalledAppGracefully(reinstallParentPid);
              console.log('DIAG_CLOSE_PARENT_END', new Date().toISOString());`);
          once("  activeAppPid = await waitForRelaunchLog(reinstallLaunch.logPath, targetVersion, 120_000, reinstallLaunch.integrationHelperPid);", `  console.log('DIAG_RELAUNCH_WAIT_BEGIN', new Date().toISOString());
            activeAppPid = await waitForRelaunchLog(reinstallLaunch.logPath, targetVersion, 120_000, reinstallLaunch.integrationHelperPid);
            console.log('DIAG_RELAUNCH_WAIT_END', new Date().toISOString(), activeAppPid);`);
          once("const isolatedProfileRoot = path.join(testRoot, 'isolated-profile');", `console.log('DIAG_ROOT=' + testRoot);
          const diagnosticTick = setInterval(() => console.log('DIAG_TICK', new Date().toISOString(), process.getActiveResourcesInfo()), 15000);
          diagnosticTick.unref();
          const isolatedProfileRoot = path.join(testRoot, 'isolated-profile');`);
          fs.writeFileSync(file, source);
          console.log('DIAG instrumented test driver sha256=' + digest(source));
          console.log('DIAG diagnostic only: no release approval; no product/helper/deadline changes');
          const probeFile = process.env.WHITEBOX_DIAGNOSTIC_PROBE_PATH || 'scripts/windows-process-exit-check.js';
          let probe = fs.readFileSync(probeFile, 'utf8').replace(/\r\n/g, '\n');
          const beforeProbe = "  const result = spawn(powershell,";
          if (probe.split(beforeProbe).length !== 2) throw new Error('Diagnostic process probe anchor was not unique');
          probe = probe.replace(beforeProbe, "  console.log('DIAG_PROBE_BEGIN', new Date().toISOString(), pids);\n" + beforeProbe);
          const afterProbe = "  if (result.error) throw result.error;";
          if (probe.split(afterProbe).length !== 2) throw new Error('Diagnostic process result anchor was not unique');
          probe = probe.replace(afterProbe, "  console.log('DIAG_PROBE_END', new Date().toISOString(), result.status, result.error?.code || '');\n" + afterProbe);
          fs.writeFileSync(probeFile, probe);
          NODE
          node --check scripts/windows-v173-update-integration.js
          node --check scripts/windows-process-exit-check.js
          git diff --name-only
          git diff --exit-code -- src package.json package-lock.json main.js preload.js renderer
      - name: Diagnose original serial cohort 1.7.3 with inherited TEMP and strict watchdog
        shell: pwsh
        timeout-minutes: 15
        env:
          WHITEBOX_FROZEN_VERSION: 1.7.3
        run: |-
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Join-Path $env:RUNNER_TEMP 'whitebox-v201-stall-diagnostic') $env:WHITEBOX_FROZEN_VERSION
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $stdout = Join-Path $output 'driver.stdout.log'
          $stderr = Join-Path $output 'driver.stderr.log'
          $originalTempParent = [IO.Path]::GetTempPath()
          if ($env:WHITEBOX_FROZEN_VERSION -notin @('1.7.3','1.7.4','1.7.5')) { throw 'Unexpected diagnostic cohort' }
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $child = Start-Process -FilePath $node -ArgumentList @('scripts/windows-v173-update-integration.js') -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $creation = $child.StartTime.ToUniversalTime()
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $outOffset = 0
          $errOffset = 0
          $timedOut = $false
          function Read-LiveText([string]$Path) {
            $stream = [IO.File]::Open($Path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
            $reader = [IO.StreamReader]::new($stream)
            try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          function Forward-Output {
            if (Test-Path -LiteralPath $stdout) {
              $value = Read-LiveText $stdout
              if ($value.Length -gt $script:outOffset) { [Console]::Out.Write($value.Substring($script:outOffset)); $script:outOffset = $value.Length }
            }
            if (Test-Path -LiteralPath $stderr) {
              $value = Read-LiveText $stderr
              if ($value.Length -gt $script:errOffset) { [Console]::Error.Write($value.Substring($script:errOffset)); $script:errOffset = $value.Length }
            }
          }
          try {
            while (-not $child.HasExited) {
              Forward-Output
              Write-Host "DIAG_WATCHDOG elapsed=$([int]$clock.Elapsed.TotalSeconds)s; node=$($child.Id); cpu=$($child.TotalProcessorTime)"
              if ($clock.Elapsed.TotalSeconds -ge 600) { $timedOut = $true; break }
              Start-Sleep -Seconds 10
              $child.Refresh()
            }
            Forward-Output
          } finally {
            $child.Refresh()
            if (-not $child.HasExited) {
              $live = Get-Process -Id $child.Id -ErrorAction Stop
              if ($live.StartTime.ToUniversalTime() -ne $creation -or $live.Path -cne $node) { throw 'Diagnostic child identity changed; refusing termination' }
              & taskkill.exe /PID $child.Id /T /F
              if ($LASTEXITCODE -ne 0) { throw 'Owned diagnostic tree termination failed' }
              if (-not $child.WaitForExit(10000)) { throw 'Owned diagnostic process remained after termination' }
            }
            Forward-Output
            $raw = if (Test-Path -LiteralPath $stdout) { Read-LiveText $stdout } else { '' }
            $match = [regex]::Match($raw, '(?m)^DIAG_ROOT=(.+)\r?$')
            if ($match.Success) {
              $root = [IO.Path]::GetFullPath($match.Groups[1].Value.Trim())
              $parent = [IO.Path]::GetFullPath($originalTempParent).TrimEnd('\')
              if ([IO.Path]::GetDirectoryName($root) -ine $parent -or [IO.Path]::GetFileName($root) -notmatch '^whitebox-v173-update-integration-[a-zA-Z0-9]+$') { throw 'Diagnostic root is not the exact owned temporary child' }
              if (Test-Path -LiteralPath $root) {
                if ((Get-Item -LiteralPath $root).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Diagnostic root is a reparse point' }
                $index = 0
                Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction Stop | Where-Object { $_.Name -in @('install-update.log','install-attempts.jsonl','main.log','renderer.log') -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } | ForEach-Object {
                  $index += 1
                  $destination = Join-Path $output ("owned-" + $index + '-' + $_.Name)
                  Copy-Item -LiteralPath $_.FullName -Destination $destination -ErrorAction Stop
                  Write-Host "DIAG retained $destination"
                }
              }
            }
          }
          if ($timedOut) { throw 'Diagnostic 600-second total deadline exceeded; this is a failed diagnostic, never release approval' }
          if (-not $child.WaitForExit(1000)) { throw 'Diagnostic child exit was not stable' }
          if ($child.ExitCode -ne 0) { throw "Diagnostic driver failed with exit code $($child.ExitCode)" }
          Write-Host 'Diagnostic completed on a fresh runner; this is not the full45+legacy release gate.'
