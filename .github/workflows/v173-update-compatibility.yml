                $index = 0
                Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction Stop | Where-Object { $_.Name -in @('install-update.log','install-attempts.jsonl','main.log','renderer.log') -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } | ForEach-Object {
                  $index += 1
                  $destination = Join-Path $output ("owned-" + $index + '-' + $_.Name)
                  Copy-Item -LiteralPath $_.FullName -Destination $destination -ErrorAction Stop
                  Write-Host "DIAG retained $destination"
                }
              }
            }
          }
          if ($timedOut) { throw 'Diagnostic 600-second total deadline exceeded; this is a failed diagnostic, never release approval' }
          if (-not $child.WaitForExit(1000)) { throw 'Diagnostic child exit was not stable' }
          if ($child.ExitCode -ne 0) { throw "Diagnostic driver failed with exit code $($child.ExitCode)" }
          Write-Host 'Diagnostic completed on a fresh runner; this is not the full45+legacy release gate.'
