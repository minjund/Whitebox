      - name: Retain diagnostic-only logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: whitebox-v201-stall-diagnostic
          path: ${{ runner.temp }}/whitebox-v201-stall-diagnostic
          if-no-files-found: error
