name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to rebuild with a corrected test driver; run from main only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: whitebox-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Verify the tag commit is on origin/main
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          git fetch --no-tags origin main:refs/remotes/origin/main
          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Release validation recovery must run from main.'; exit 1; }
            tag_commit="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
            # A recovery may update only verification code. Product sources,
            # dependencies, package metadata and build hooks remain identical.
            git diff --name-only --no-renames "$tag_commit" "$GITHUB_SHA" > "$RUNNER_TEMP/validation-changes.txt"
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/release.yml|.github/workflows/v173-update-compatibility.yml|.github/workflows/windows-update-shards.yml|scripts/windows-update-shards.js|scripts/tests/windows-update-shards.js|scripts/terminal-workspace-check.js|scripts/packaged-update-button.js|scripts/windows-process-exit-check.js|scripts/windows-v173-update-integration.js|scripts/windows-legacy-update-bridge-integration.js|scripts/tests/packaged-update-driver.js|scripts/regression-test.js|scripts/tests/core-update-workspace.js|docs/RELEASING.md) ;;
                *) echo "Recovery changes a file outside the verification allowlist: $file"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/validation-changes.txt"
            echo "Validation source: $GITHUB_SHA; immutable product source: $tag_commit"
          else
            tag_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
            if [ "$checked_out_commit" != "${GITHUB_SHA,,}" ]; then
              echo "Checked out commit $checked_out_commit does not match event tag SHA ${GITHUB_SHA:-<missing>}."
              exit 1
            fi
          fi
          if [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "Checked out commit $checked_out_commit does not match tag commit $tag_commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag commit $tag_commit is not an ancestor of origin/main."
            exit 1
          fi
          echo "source_sha=$tag_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify previousFixed matches the public latest stable release
        run: npm run check:update:cohorts
      - run: npm run check:source
      - run: npm test
      - run: npm run test:accuracy
      - run: npm audit --audit-level=high
      - run: npm run check:package
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e "const expected=process.env.RELEASE_TAG.replace(/^v/,'');const actual=require('./package.json').version;if(!/^(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)$/.test(actual))throw new Error('release version must be stable SemVer: '+actual);if(actual!==expected)throw new Error('package version '+actual+' does not match release '+expected)"

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            command: npm run dist:mac
            artifact: Whitebox-macOS
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            command: npm run dist:win
            artifact: Whitebox-Windows
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Verify the exact Windows tag commit
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Tag event SHA must be a full 40-character commit SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()) { throw "Checked out $actual instead of $env:EXPECTED_SOURCE_SHA" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: brew install tmux
      - name: Use reviewed verification fixtures against the immutable source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VALIDATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code
          git fetch --no-tags origin "$VALIDATION_SOURCE_SHA"
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const sha = process.env.VALIDATION_SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid validation SHA');
          const files = ['scripts/terminal-workspace-check.js', 'scripts/tests/core-update-workspace.js'];
          for (const file of files) {
            fs.writeFileSync(file, cp.execFileSync('git', ['show', sha + ':' + file]));
            console.log('Reviewed test ' + file + ' at ' + sha + '; SHA-256 ' + require('crypto').createHash('sha256').update(fs.readFileSync(file)).digest('hex'));
          }
          const changed = cp.execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          if (changed.some(file => !files.includes(file))) throw new Error('Recovery changed non-test source: ' + changed.join(', '));
          NODE
      - run: npm test
      - run: npm run test:terminal
      - run: npm run test:terminal:startup
      - run: npm run test:terminal:tmux-pane
      - run: npm run test:bridge
      - name: Verify renderer profile recovery and idempotence
        run: npm run test:brand-profile-recovery
      - name: Verify cross-version profile locking
        run: npm run test:interim-profile-guard
      - name: Verify visible Whitebox name and icons
        run: npm run test:brand-surface
      - name: Verify completed-result review persistence
        run: npm run test:result-review
      - name: Verify inline PTY interaction contract
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-conversation
      - name: Verify inline actual PTY end to end
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-actual-pty
      - name: Upload drawer conversation diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Diagnostics-drawer-conversation-${{ github.run_attempt }}
          path: |
            artifacts/drawer-terminal-visual.log
            artifacts/inline-actual-pty-integration.log
            artifacts/pty-focus-actual-pty-integration.log
            artifacts/whitebox-pty-focus-actual-pty-failure.png
            artifacts/whitebox-drawer-*.png
            artifacts/whitebox-inline-*.png
            artifacts/whitebox-history-empty.png
          if-no-files-found: ignore
      - if: runner.os == 'macOS'
        run: npm run test:terminal:mac-stress
      - name: Restore and verify the immutable source before packaging
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- scripts/terminal-workspace-check.js scripts/tests/core-update-workspace.js
          git diff --exit-code
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: "true"
      - name: Verify packaged Windows Authenticode checks
        if: runner.os == 'Windows'
        run: node scripts/windows-signature-verification-check.js
      - name: Use the reviewed shard verifier after packaging
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: bash
        env:
          VALIDATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git diff --exit-code
          git fetch --no-tags origin "$VALIDATION_SOURCE_SHA"
          git show "$VALIDATION_SOURCE_SHA:scripts/windows-update-shards.js" > scripts/windows-update-shards.js
          node -e 'const fs=require("node:fs"),c=require("node:crypto");console.log("Reviewed CI verifier "+process.env.VALIDATION_SOURCE_SHA+"; SHA-256 "+c.createHash("sha256").update(fs.readFileSync("scripts/windows-update-shards.js")).digest("hex"))'
      - name: Pin the exact Windows artifacts and complete compatibility plan
        if: runner.os == 'Windows'
        run: node scripts/windows-update-shards.js create
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      - name: Use the reviewed packaged Mac test driver after packaging
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        shell: bash
        env:
          VALIDATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git diff --exit-code
          git fetch --no-tags origin "$VALIDATION_SOURCE_SHA"
          git show "$VALIDATION_SOURCE_SHA:scripts/packaged-update-button.js" > scripts/packaged-update-button.js
          node -e 'const fs=require("node:fs"),c=require("node:crypto");console.log("Reviewed Mac driver "+process.env.VALIDATION_SOURCE_SHA+"; SHA-256 "+c.createHash("sha256").update(fs.readFileSync("scripts/packaged-update-button.js")).digest("hex"))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: Windows-update-plan-${{ github.run_attempt }}
          path: artifacts/windows-update-plan/plan.json
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: npm run test:artifacts:mac
      - if: runner.os == 'macOS'
        run: node scripts/mac-packaged-brand-identity.js release/mac/Whitebox.app
      - if: runner.os == 'macOS'
        run: node scripts/mac-update-cohort-check.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          overwrite: true
      - name: Preserve the verified native helper for npm Windows clients
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-signature-verifier
          path: release/win-unpacked/resources/whitebox-signature-check.exe
          if-no-files-found: error

  verify_windows_update:
    name: Packaged Windows updater shards
    needs: [prepare, build-desktop]
    uses: ./.github/workflows/windows-update-shards.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      candidate_artifact: Whitebox-Windows
      plan_artifact: Windows-update-plan-${{ github.run_attempt }}
      validation_sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

  verify-mac-arm64:
    needs: [prepare, build-desktop]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci
      - name: Use the reviewed test driver for the immutable ARM64 artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          VALIDATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code
          git fetch --no-tags origin "$VALIDATION_SOURCE_SHA"
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const sha = process.env.VALIDATION_SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid validation SHA');
          fs.writeFileSync('scripts/packaged-update-button.js', cp.execFileSync('git', ['show', sha + ':scripts/packaged-update-button.js']));
          const changed = cp.execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim();
          if (changed && changed !== 'scripts/packaged-update-button.js') throw new Error('Recovery changed more than the test driver: ' + changed);
          console.log('Reviewed test driver ' + sha + '; file SHA-256 ' + require('crypto').createHash('sha256').update(fs.readFileSync('scripts/packaged-update-button.js')).digest('hex'));
          NODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Whitebox-macOS
          path: release
      - run: |
          test "$(node -p process.arch)" = arm64
          version="$(node -p 'require("./package.json").version')"
          ditto -x -k "release/Whitebox-$version-arm64.zip" release/mac-arm64
          node scripts/mac-packaged-brand-identity.js release/mac-arm64/Whitebox.app
          node scripts/mac-update-cohort-check.js

  draft-release:
    needs: [prepare, build-desktop, verify-mac-arm64, verify_windows_update]
    if: ${{ success() && needs.verify_windows_update.outputs.verified == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Whitebox-*
          path: release-assets
          merge-multiple: true
      - name: Create a draft GitHub release and attach verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          export RELEASE_VERSION="$release_version"
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          const expected = [
            `Whitebox-Setup-${version}.exe`,
            `Whitebox-Manual-Setup-${version}-x64.exe`,
            `Whitebox-${version}-portable.exe`,
            `Whitebox-${version}-arm64.dmg`,
            `Whitebox-${version}-x64.dmg`,
            `Whitebox-${version}-arm64.zip`,
            `Whitebox-${version}-x64.zip`,
          ].sort();
          const actual = fs.readdirSync('release-assets')
            .filter(name => fs.statSync(`release-assets/${name}`).isFile())
            .sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Release artifact set mismatch.\nExpected: ${expected.join(', ')}\nActual: ${actual.join(', ')}`);
          }
          for (const name of actual) {
            if (fs.statSync(`release-assets/${name}`).size <= 0) throw new Error(`Empty release artifact: ${name}`);
          }
          NODE

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            metadata="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
            METADATA="$metadata" node -e 'const release=JSON.parse(process.env.METADATA);if(release.tagName!==process.env.RELEASE_TAG||release.isDraft!==true||release.isPrerelease!==false)throw new Error("Refusing to reuse a non-matching or already-public release: "+JSON.stringify(release));'
            echo "Reusing the existing draft without overwriting any asset; byte validation follows."
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi

          metadata="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isPrerelease)"
          release_id="$(METADATA="$metadata" node <<'NODE'
          const release = JSON.parse(process.env.METADATA);
          if (release.tagName !== process.env.RELEASE_TAG || release.isDraft !== true || release.isPrerelease !== false) {
            throw new Error(`Draft release state mismatch: ${JSON.stringify(release)}`);
          }
          if (!Number.isSafeInteger(release.databaseId) || release.databaseId <= 0) {
            throw new Error(`Draft release database ID was invalid: ${JSON.stringify(release)}`);
          }
          process.stdout.write(String(release.databaseId));
          NODE
          )"
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/whitebox-draft-release.json"
          WHITEBOX_RELEASE_VERSION="$release_version" \
            WHITEBOX_RELEASE_ASSET_DIR="release-assets" \
            WHITEBOX_RELEASE_JSON="$RUNNER_TEMP/whitebox-draft-release.json" \
            WHITEBOX_EXPECT_DRAFT="true" \
            node scripts/release-asset-contract.js
          download_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
          DRAFT_DOWNLOAD_DIR="$download_dir" node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const localDir = path.resolve('release-assets');
          const draftDir = process.env.DRAFT_DOWNLOAD_DIR;
          const localNames = fs.readdirSync(localDir).filter(name => fs.statSync(path.join(localDir, name)).isFile()).sort();
          const draftNames = fs.readdirSync(draftDir).filter(name => fs.statSync(path.join(draftDir, name)).isFile()).sort();
          if (JSON.stringify(localNames) !== JSON.stringify(draftNames)) {
            throw new Error(`Draft asset set mismatch.\nLocal: ${localNames.join(', ')}\nDraft: ${draftNames.join(', ')}`);
          }
          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          for (const name of localNames) {
            const local = path.join(localDir, name);
            const draft = path.join(draftDir, name);
            const localStat = fs.statSync(local);
            const draftStat = fs.statSync(draft);
            if (localStat.size !== draftStat.size || digest(local) !== digest(draft)) {
              throw new Error(`Draft asset bytes differ from the verified build artifact: ${name}`);
            }
          }
          const version = process.env.RELEASE_VERSION;
          const canonical = path.join(draftDir, `Whitebox-Setup-${version}.exe`);
          const manual = path.join(draftDir, `Whitebox-Manual-Setup-${version}-x64.exe`);
          if (fs.statSync(canonical).size !== fs.statSync(manual).size || digest(canonical) !== digest(manual)) {
            throw new Error('Canonical Setup and frozen-client manual alias are not byte-identical.');
          }
          NODE

  publish-npm:
    needs: [prepare, draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Include the verified Windows helper in the npm distribution
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-signature-verifier
          path: build/generated
      - name: Verify npm runtime contents
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        run: npm run check:package
        env:
          WHITEBOX_REQUIRE_NATIVE_VERIFIER: "true"
      - name: Check whether npm version already exists
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        id: npm_version
        shell: bash
        run: |
          package="$(node -p "const value=require('./package.json'); value.name+'@'+value.version")"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped npm publication
        if: ${{ vars.PUBLISH_NPM != 'true' }}
        run: echo "Desktop release continues without npm publication; bootstrap whitebox-ai separately, then enable trusted publishing."
      - name: Publish npm package with provenance
        if: ${{ vars.PUBLISH_NPM == 'true' && steps.npm_version.outputs.published != 'true' }}
        run: npm publish --access public --tag latest
      - name: Verify npm publication
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for _attempt in {1..12}; do
            published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            if [ "$published" = "$package_version" ]; then exit 0; fi
            sleep 5
          done
          exit 1

  publish-release:
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the fully verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          CURRENT_TAG="$RELEASE_TAG" LATEST_TAG="$latest_tag" node <<'NODE'
          const stable = value => {
            const match = String(value || '').match(/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            if (!match) throw new Error(`Public release tag is not stable SemVer: ${value || '<missing>'}`);
            return match.slice(1).map(Number);
          };
          const current = stable(process.env.CURRENT_TAG);
          if (process.env.LATEST_TAG) {
            const latest = stable(process.env.LATEST_TAG);
            for (let index = 0; index < 3; index += 1) {
              if (current[index] > latest[index]) break;
              if (current[index] < latest[index]) {
                throw new Error(`Refusing to move latest backward from ${process.env.LATEST_TAG} to ${process.env.CURRENT_TAG}`);
              }
            }
          }
          NODE
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
          published_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$published_latest" != "$RELEASE_TAG" ]; then
            echo "Public latest resolved to $published_latest instead of $RELEASE_TAG."
            exit 1
          fi

  verify-legacy-update-channel:
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
