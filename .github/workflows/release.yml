name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - run: npm run test:accuracy
      - run: npm audit --audit-level=high
      - run: npm run check:package
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected=process.env.RELEASE_TAG.replace(/^v/,'');const actual=require('./package.json').version;if(actual!==expected){throw new Error('package version '+actual+' does not match release '+expected)}"

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            command: npm run dist:mac
            artifact: Whitebox-macOS
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            command: npm run dist:win
            artifact: Whitebox-Windows
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm test
      - run: npm run test:terminal
      - run: npm run test:terminal:tmux-pane
      - run: npm run test:bridge
      - name: Verify renderer profile recovery and idempotence
        run: npm run test:brand-profile-recovery
      - name: Verify cross-version profile locking
        run: npm run test:interim-profile-guard
      - name: Verify visible Whitebox name and icons
        run: npm run test:brand-surface
      - name: Verify completed-result review persistence
        run: npm run test:result-review
      - name: Verify inline PTY interaction contract
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-conversation
      - name: Verify inline actual PTY end to end
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-actual-pty
      - name: Upload drawer conversation diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Diagnostics-drawer-conversation-${{ github.run_attempt }}
          path: |
            artifacts/drawer-terminal-visual.log
            artifacts/inline-actual-pty-integration.log
            artifacts/whitebox-drawer-*.png
            artifacts/whitebox-inline-*.png
            artifacts/whitebox-history-empty.png
          if-no-files-found: ignore
      - if: runner.os == 'macOS'
        run: npm run test:terminal:mac-stress
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: "true"
      - name: Download the pinned Whitebox v1.7.3 Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'whitebox-v173-source'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          gh release download v1.7.3 --repo minjund/Whitebox --pattern Whitebox-Setup-1.7.3.exe --dir $sourceDir
          $targetVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $targetInstaller = (Resolve-Path -LiteralPath "release/Whitebox-Setup-$targetVersion.exe").Path
          $manualInstaller = Join-Path (Split-Path -Parent $targetInstaller) "Whitebox-Manual-Setup-$targetVersion-x64.exe"
          Copy-Item -LiteralPath $targetInstaller -Destination $manualInstaller -Force
          if ((Get-Item -LiteralPath $targetInstaller).Length -ne (Get-Item -LiteralPath $manualInstaller).Length) { throw 'Manual bridge installer size differs from canonical Setup' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $targetInstaller).Hash -cne (Get-FileHash -Algorithm SHA256 -LiteralPath $manualInstaller).Hash) { throw 'Manual bridge installer digest differs from canonical Setup' }
          "WHITEBOX_V173_INSTALLER=$(Join-Path $sourceDir 'Whitebox-Setup-1.7.3.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER=$targetInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_MANUAL_INSTALLER=$manualInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify packaged v1.7.3 update and target bootstrap acknowledgement
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: npm run test:update:win:v173
      - if: runner.os == 'macOS'
        run: npm run test:artifacts:mac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Whitebox-*
          path: release-assets
          merge-multiple: true
      - name: Create a draft GitHub release and attach verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=true --repo "$GITHUB_REPOSITORY"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi

  publish-npm:
    needs: draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Check whether npm version already exists
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        id: npm_version
        shell: bash
        run: |
          package="$(node -p "const value=require('./package.json'); value.name+'@'+value.version")"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped npm publication
        if: ${{ vars.PUBLISH_NPM != 'true' }}
        run: echo "Desktop release continues without npm publication; bootstrap whitebox-ai separately, then enable trusted publishing."
      - name: Publish npm package with provenance
        if: ${{ vars.PUBLISH_NPM == 'true' && steps.npm_version.outputs.published != 'true' }}
        run: npm publish --access public --tag latest
      - name: Verify npm publication
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            if [ "$published" = "$package_version" ]; then exit 0; fi
            sleep 5
          done
          exit 1

  publish-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the fully verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"

  verify-legacy-update-channel:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify v1.6.3 -> bridge -> latest update path
        env:
          EXPECTED_CURRENT_TAG: ${{ github.ref_name }}
        run: node scripts/check-legacy-update-channel.js
