name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: whitebox-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tag commit is on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$checked_out_commit" != "${GITHUB_SHA,,}" ]; then
            echo "Checked out commit $checked_out_commit does not match event tag SHA ${GITHUB_SHA:-<missing>}."
            exit 1
          fi
          if [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "Checked out commit $checked_out_commit does not match tag commit $tag_commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag commit $tag_commit is not an ancestor of origin/main."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify previousFixed matches the public latest stable release
        run: npm run check:update:cohorts
      - run: npm run check:source
      - run: npm test
      - run: npm run test:accuracy
      - run: npm audit --audit-level=high
      - run: npm run check:package
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected=process.env.RELEASE_TAG.replace(/^v/,'');const actual=require('./package.json').version;if(!/^(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)$/.test(actual))throw new Error('release version must be stable SemVer: '+actual);if(actual!==expected)throw new Error('package version '+actual+' does not match release '+expected)"

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            command: npm run dist:mac
            artifact: Whitebox-macOS
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            command: npm run dist:win
            artifact: Whitebox-Windows
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the exact Windows tag commit
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Tag event SHA must be a full 40-character commit SHA' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA.ToLowerInvariant()) { throw "Checked out $actual instead of $env:EXPECTED_SOURCE_SHA" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm test
      - run: npm run test:terminal
      - run: npm run test:terminal:tmux-pane
      - run: npm run test:bridge
      - name: Verify renderer profile recovery and idempotence
        run: npm run test:brand-profile-recovery
      - name: Verify cross-version profile locking
        run: npm run test:interim-profile-guard
      - name: Verify visible Whitebox name and icons
        run: npm run test:brand-surface
      - name: Verify completed-result review persistence
        run: npm run test:result-review
      - name: Verify inline PTY interaction contract
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-conversation
      - name: Verify inline actual PTY end to end
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm run test:drawer-actual-pty
      - name: Upload drawer conversation diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Diagnostics-drawer-conversation-${{ github.run_attempt }}
          path: |
            artifacts/drawer-terminal-visual.log
            artifacts/inline-actual-pty-integration.log
            artifacts/whitebox-drawer-*.png
            artifacts/whitebox-inline-*.png
            artifacts/whitebox-history-empty.png
          if-no-files-found: ignore
      - if: runner.os == 'macOS'
        run: npm run test:terminal:mac-stress
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: npm run test:artifacts:win
        env:
          WHITEBOX_ALLOW_UNSIGNED: "true"
      - name: Download every installer pinned by the compatibility cohort manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'scripts/update-compatibility-cohorts.json' -Raw | ConvertFrom-Json
          if (@($manifest.frozen).Count -ne 2 -or $null -eq $manifest.previousFixed) {
            throw 'Compatibility cohort manifest must contain two frozen cohorts and one previousFixed cohort'
          }
          $cohorts = @($manifest.frozen) + @($manifest.previousFixed)
          if ($cohorts.Count -ne 3) { throw "Expected exactly three compatibility cohorts, found $($cohorts.Count)" }
          $sourceDir = Join-Path $env:RUNNER_TEMP 'whitebox-frozen-source'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          function Assert-PinnedInstaller([string]$Path, [long]$ExpectedSize, [string]$ExpectedSha256) {
            $item = Get-Item -LiteralPath $Path
            if ($item.Length -ne $ExpectedSize) { throw "Pinned installer size mismatch for $Path`: $($item.Length)" }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $ExpectedSha256) { throw "Pinned installer SHA-256 mismatch for $Path`: $actualSha256" }
          }
          foreach ($cohort in $cohorts) {
            $uri = [Uri][string]$cohort.url
            $installerName = [System.IO.Path]::GetFileName($uri.AbsolutePath)
            $installerPath = Join-Path $sourceDir $installerName
            $environmentName = [string]$cohort.env
            if ($environmentName -notmatch '^WHITEBOX_V[0-9]+_INSTALLER$') {
              throw "Unsafe compatibility cohort environment name: $environmentName"
            }
            Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $installerPath
            Assert-PinnedInstaller $installerPath ([long]$cohort.size) ([string]$cohort.sha256)
            "$environmentName=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $targetVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $targetInstaller = (Resolve-Path -LiteralPath "release/Whitebox-Setup-$targetVersion.exe").Path
          $manualInstaller = Join-Path (Split-Path -Parent $targetInstaller) "Whitebox-Manual-Setup-$targetVersion-x64.exe"
          Copy-Item -LiteralPath $targetInstaller -Destination $manualInstaller -Force
          if ((Get-Item -LiteralPath $targetInstaller).Length -ne (Get-Item -LiteralPath $manualInstaller).Length) { throw 'Manual bridge installer size differs from canonical Setup' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $targetInstaller).Hash -cne (Get-FileHash -Algorithm SHA256 -LiteralPath $manualInstaller).Hash) { throw 'Manual bridge installer digest differs from canonical Setup' }
          $targetSize = (Get-Item -LiteralPath $targetInstaller).Length
          $targetSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $targetInstaller).Hash.ToLowerInvariant()
          "WHITEBOX_CURRENT_INSTALLER=$targetInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_MANUAL_INSTALLER=$manualInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER_SIZE=$targetSize" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_CURRENT_INSTALLER_SHA256=$targetSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHITEBOX_LEGACY_CANDIDATE_E2E=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify the official legacy update inputs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'whitebox-legacy-update-inputs'
          New-Item -ItemType Directory -Path $fixtureDir -Force | Out-Null
          function Get-VerifiedReleaseAsset(
            [string]$Repository,
            [string]$Tag,
            [string]$Name,
            [long]$ExpectedSize,
            [string]$ExpectedSha256,
            [bool]$RequireImmutable,
            [bool]$RequireSoleAsset,
            [string]$EnvironmentName
          ) {
            $release = gh api "repos/$Repository/releases/tags/$Tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to read $Repository $Tag" }
            if ($release.tag_name -cne $Tag -or $release.draft -ne $false -or $release.prerelease -ne $false) {
              throw "Official release state mismatch for $Repository $Tag"
            }
            if ($RequireImmutable -and [bool]$release.immutable -ne $true) {
              throw "Official release is not immutable: $Repository $Tag"
            }
            if ($release.html_url -cne "https://github.com/$Repository/releases/tag/$Tag") {
              throw "Official release URL mismatch for $Repository $Tag"
            }
            if ($RequireSoleAsset -and @($release.assets).Count -ne 1) {
              throw 'Official bridge release must contain exactly one asset'
            }
            $matches = @($release.assets | Where-Object { $_.name -ceq $Name })
            if ($matches.Count -ne 1) { throw "Expected exactly one official $Name asset" }
            $asset = $matches[0]
            $expectedUrl = "https://github.com/$Repository/releases/download/$Tag/$Name"
            if ($asset.state -cne 'uploaded' -or $asset.browser_download_url -cne $expectedUrl) {
              throw "Official asset state or URL mismatch for $Name"
            }
            if ([long]$asset.size -ne $ExpectedSize -or [string]$asset.digest -cne "sha256:$ExpectedSha256") {
              throw "Official asset API size or digest mismatch for $Name"
            }
            $destination = Join-Path $fixtureDir $Name
            Invoke-WebRequest -Uri $expectedUrl -OutFile $destination
            if ((Get-Item -LiteralPath $destination).Length -ne $ExpectedSize) {
              throw "Downloaded official asset size mismatch for $Name"
            }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $ExpectedSha256) {
              throw "Downloaded official asset SHA-256 mismatch for $Name`: $actualSha256"
            }
            "$EnvironmentName=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Get-VerifiedReleaseAsset 'minjund/Whitebox' 'v1.6.3' 'LoadToAgent-Setup-1.6.3.exe' 92488826 'e38c38698335c2eec4aef8c6da6f1629470addaff1b881fe961172644c86db0f' $false $false 'WHITEBOX_V163_INSTALLER'
          Get-VerifiedReleaseAsset 'minjund/LodeToAgent' 'v1.6.23' 'LoadToAgent-Setup-1.6.23.exe' 94506459 '29e90370acd3a6f00d3da4a82a79045cf235e716dcccbbf34b2d2b4db9f4e112' $true $true 'WHITEBOX_V1623_INSTALLER'
      - name: Verify all three packaged Whitebox compatibility cohorts
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $manifest = Get-Content -LiteralPath 'scripts/update-compatibility-cohorts.json' -Raw | ConvertFrom-Json
          $cohorts = @($manifest.frozen) + @($manifest.previousFixed)
          if ($cohorts.Count -ne 3) { throw "Expected exactly three compatibility cohorts, found $($cohorts.Count)" }
          $attempt = 0
          foreach ($cohort in $cohorts) {
            $attempt += 1
            $env:WHITEBOX_FROZEN_VERSION = [string]$cohort.version
            Write-Host "Running packaged cohort $attempt/3: $env:WHITEBOX_FROZEN_VERSION ($($cohort.installMode))"
            & npm.cmd run test:update:win:frozen
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged cohort $env:WHITEBOX_FROZEN_VERSION failed with exit code $LASTEXITCODE"
            }
          }
          if ($attempt -ne 3) { throw "Expected three packaged attempts, ran $attempt" }
      - name: Verify the official v1.6.3 to bridge to candidate path
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: npm run test:update:win:legacy-bridge
      - if: runner.os == 'macOS'
        run: npm run test:artifacts:mac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Whitebox-*
          path: release-assets
          merge-multiple: true
      - name: Create a draft GitHub release and attach verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          export RELEASE_VERSION="$release_version"
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          const expected = [
            `Whitebox-Setup-${version}.exe`,
            `Whitebox-Manual-Setup-${version}-x64.exe`,
            `Whitebox-${version}-portable.exe`,
            `Whitebox-${version}-arm64.dmg`,
            `Whitebox-${version}-x64.dmg`,
            `Whitebox-${version}-arm64.zip`,
            `Whitebox-${version}-x64.zip`,
          ].sort();
          const actual = fs.readdirSync('release-assets')
            .filter(name => fs.statSync(`release-assets/${name}`).isFile())
            .sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Release artifact set mismatch.\nExpected: ${expected.join(', ')}\nActual: ${actual.join(', ')}`);
          }
          for (const name of actual) {
            if (fs.statSync(`release-assets/${name}`).size <= 0) throw new Error(`Empty release artifact: ${name}`);
          }
          NODE

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            metadata="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
            METADATA="$metadata" node -e 'const release=JSON.parse(process.env.METADATA);if(release.tagName!==process.env.RELEASE_TAG||release.isDraft!==true||release.isPrerelease!==false)throw new Error("Refusing to reuse a non-matching or already-public release: "+JSON.stringify(release));'
            echo "Reusing the existing draft without overwriting any asset; byte validation follows."
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi

          metadata="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          METADATA="$metadata" node <<'NODE'
          const release = JSON.parse(process.env.METADATA);
          if (release.tagName !== process.env.RELEASE_TAG || release.isDraft !== true || release.isPrerelease !== false) {
            throw new Error(`Draft release state mismatch: ${JSON.stringify(release)}`);
          }
          NODE
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/whitebox-draft-release.json"
          WHITEBOX_RELEASE_VERSION="$release_version" \
            WHITEBOX_RELEASE_ASSET_DIR="release-assets" \
            WHITEBOX_RELEASE_JSON="$RUNNER_TEMP/whitebox-draft-release.json" \
            WHITEBOX_EXPECT_DRAFT="true" \
            node scripts/release-asset-contract.js
          download_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
          DRAFT_DOWNLOAD_DIR="$download_dir" node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const localDir = path.resolve('release-assets');
          const draftDir = process.env.DRAFT_DOWNLOAD_DIR;
          const localNames = fs.readdirSync(localDir).filter(name => fs.statSync(path.join(localDir, name)).isFile()).sort();
          const draftNames = fs.readdirSync(draftDir).filter(name => fs.statSync(path.join(draftDir, name)).isFile()).sort();
          if (JSON.stringify(localNames) !== JSON.stringify(draftNames)) {
            throw new Error(`Draft asset set mismatch.\nLocal: ${localNames.join(', ')}\nDraft: ${draftNames.join(', ')}`);
          }
          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          for (const name of localNames) {
            const local = path.join(localDir, name);
            const draft = path.join(draftDir, name);
            const localStat = fs.statSync(local);
            const draftStat = fs.statSync(draft);
            if (localStat.size !== draftStat.size || digest(local) !== digest(draft)) {
              throw new Error(`Draft asset bytes differ from the verified build artifact: ${name}`);
            }
          }
          const version = process.env.RELEASE_VERSION;
          const canonical = path.join(draftDir, `Whitebox-Setup-${version}.exe`);
          const manual = path.join(draftDir, `Whitebox-Manual-Setup-${version}-x64.exe`);
          if (fs.statSync(canonical).size !== fs.statSync(manual).size || digest(canonical) !== digest(manual)) {
            throw new Error('Canonical Setup and frozen-client manual alias are not byte-identical.');
          }
          NODE

  publish-npm:
    needs: draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Check whether npm version already exists
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        id: npm_version
        shell: bash
        run: |
          package="$(node -p "const value=require('./package.json'); value.name+'@'+value.version")"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped npm publication
        if: ${{ vars.PUBLISH_NPM != 'true' }}
        run: echo "Desktop release continues without npm publication; bootstrap whitebox-ai separately, then enable trusted publishing."
      - name: Publish npm package with provenance
        if: ${{ vars.PUBLISH_NPM == 'true' && steps.npm_version.outputs.published != 'true' }}
        run: npm publish --access public --tag latest
      - name: Verify npm publication
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            if [ "$published" = "$package_version" ]; then exit 0; fi
            sleep 5
          done
          exit 1

  publish-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the fully verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          CURRENT_TAG="$RELEASE_TAG" LATEST_TAG="$latest_tag" node <<'NODE'
          const stable = value => {
            const match = String(value || '').match(/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            if (!match) throw new Error(`Public release tag is not stable SemVer: ${value || '<missing>'}`);
            return match.slice(1).map(Number);
          };
          const current = stable(process.env.CURRENT_TAG);
          if (process.env.LATEST_TAG) {
            const latest = stable(process.env.LATEST_TAG);
            for (let index = 0; index < 3; index += 1) {
              if (current[index] > latest[index]) break;
              if (current[index] < latest[index]) {
                throw new Error(`Refusing to move latest backward from ${process.env.LATEST_TAG} to ${process.env.CURRENT_TAG}`);
              }
            }
          }
          NODE
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
          published_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$published_latest" != "$RELEASE_TAG" ]; then
            echo "Public latest resolved to $published_latest instead of $RELEASE_TAG."
            exit 1
          fi

  verify-legacy-update-channel:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify v1.6.3 -> bridge -> latest update path
        env:
          EXPECTED_CURRENT_TAG: ${{ github.ref_name }}
        run: node scripts/check-legacy-update-channel.js
