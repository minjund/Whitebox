<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="wb-token" content="__WHITEBOX_TOKEN__">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/phone.css">
  <title>Whitebox</title>
</head>
<body id="terminalWorkspace">
  <main id="list" class="view">
    <header class="bar">
      <div class="brand"><img src="/icon.png" alt=""><span>Whitebox</span></div>
      <span class="host">__WHITEBOX_HOST__</span>
      <button id="install" class="install" type="button" hidden></button>
    </header>
    <p id="installHint" class="hint" hidden></p>
    <p id="notice" class="notice" hidden></p>
    <div id="panels"></div>
  </main>
  <section id="chat" class="view wb-chat" hidden>
    <header class="bar">
      <button id="back" class="icon" type="button" aria-label="Back">‹</button>
      <div class="title"><strong id="chatTitle"></strong><span id="chatMeta"></span></div>
      <button id="stop" class="stop" type="button" hidden></button>
      <span id="chatState" class="dot"></span>
    </header>
    <div id="stopConfirm" class="confirm" hidden><span></span><button type="button" data-stop="yes"></button><button type="button" data-stop="no"></button></div>
    <div id="log" class="wb-chat-log" role="log" aria-live="polite"></div>
    <div id="question" class="question" hidden>
      <strong></strong>
      <pre></pre>
      <div class="keys" role="toolbar">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="enter">Enter</button>
        <button type="button" data-key="esc">Esc</button>
      </div>
    </div>
    <p id="off" class="off" hidden></p>
    <form id="compose" class="wb-chat-composer" autocomplete="off">
      <textarea id="text" rows="1"></textarea>
      <button id="send" class="wb-chat-send" type="submit"></button>
    </form>
  </section>
  <script src="/chat-render.js"></script>
  <script type="module" src="/phone.js"></script>
</body>
</html>
