<header class="review-header">
  <div class="eyebrow"><b>WHITEBOX</b><span>/</span><span>SIDEBAR STUDY 012</span></div>
  <div class="header-line"><h1>프로젝트 이름부터, 한눈에.</h1><div class="review-controls"><button class="quiet-button reset" id="reset">초기화</button><select id="theme" aria-label="테마"><option value="dark">다크</option><option value="light">라이트</option></select></div></div>
  <p class="intro">장식은 줄이고, 이름과 작업의 위계는 또렷하게. 같은 프로젝트를 세 가지 방식으로 정리했습니다.</p>
  <nav class="review-nav" aria-label="스케치 보기">
    <button class="review-tab" data-view="a" aria-pressed="false">A · 심플 리스트 <em>추천</em></button>
    <button class="review-tab" data-view="b" aria-pressed="false">B · 프로젝트 트리</button>
    <button class="review-tab" data-view="c" aria-pressed="false">C · 상태 중심</button>
    <button class="review-tab compare-tab active" data-view="compare" aria-pressed="true">나란히 비교</button>
  </nav>
</header>
<main id="canvas" class="canvas"></main>
<footer class="review-footer"><p id="view-hint">프로젝트 선택 · 화살표로 펼치기 · 검색 · 더보기 메뉴를 직접 눌러보세요.</p><p class="refs">참고 <a href="https://github.com/stablyai/orca" target="_blank" rel="noreferrer">Orca</a> · <a href="https://github.com/manaflow-ai/cmux" target="_blank" rel="noreferrer">cmux</a> <span aria-hidden="true"> / </span> 가상 데이터 스케치</p></footer>
<div class="tools" aria-label="스케치 도구">
  <label>상태 <select id="dataset" aria-label="샘플 데이터"><option value="normal">기본 8개</option><option value="many">많은 프로젝트</option><option value="empty">빈 목록</option><option value="loading">불러오는 중</option><option value="error">연결 오류</option></select></label>
  <span class="tools-divider"></span><span class="viewport-tools"><button data-width="375" aria-label="375px 너비">375</button><button data-width="768" aria-label="768px 너비">768</button><button data-width="full" aria-label="전체 너비">전체</button></span>
  <span class="tools-divider"></span><button id="inspect" aria-pressed="false">수치 보기</button>
</div>
<div id="toast" class="toast" role="status"></div><div id="menu" class="menu" hidden></div><div id="annotation" class="annotation" hidden></div>
<dialog id="add-dialog" aria-labelledby="add-title"><form id="add-form"><h2 id="add-title">프로젝트 추가</h2><p>스케치 안의 목록에만 추가됩니다. 실제 폴더는 변경하지 않습니다.</p><label>프로젝트 이름<input name="name" maxlength="70" required autocomplete="off" placeholder="예: my-project"></label><label>폴더 경로<input name="path" maxlength="200" required autocomplete="off" placeholder="D:/projects/my-project"></label><div class="dialog-actions"><button type="button" class="quiet-button" id="cancel-add">취소</button><button type="submit" class="primary-button">추가</button></div></form></dialog>

});
document.getElementById('cancel-add').onclick=()=>document.getElementById('add-dialog').close();
document.getElementById('add-form').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget,name=form.elements.name.value.trim(),path=form.elements.path.value.trim();if(!name||!path){notify('프로젝트 이름과 경로를 입력해주세요.');return;}const id='custom-'+Date.now();projects.push({id,name,path,summary:'새 프로젝트',tasks:[]});if(dataset==='empty'||dataset==='error'||dataset==='loading'){dataset='normal';document.getElementById('dataset').value='normal';}for(const m of Object.keys(modes)){queries[m]='';selected[m]=id;}document.getElementById('add-dialog').close();form.reset();render();notify(`${name}을 추가했습니다.`);});
document.getElementById('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
function setDataset(value){dataset=value;projects=value==='empty'?[]:structuredClone(seed);if(value==='many'){projects.push({id:'long-name',name:'commerce-integration-platform-admin-console',path:'D:/projects/commerce-integration-platform-admin-console',summary:'긴 이름 · 한 줄로 정리, 전체 이름은 마우스 오버',tasks:[]});for(let i=1;i<=23;i++)projects.push({id:`extra-${i}`,name:`workspace-${i}`,path:`D:/projects/workspace-${i}`,summary:'최근 작업 없음',tasks:[]});}for(const m of Object.keys(modes)){queries[m]='';selected[m]='whitebox';currentTasks[m]=null;expanded[m].clear();closedSources[m].clear();}if(value==='normal')expanded.b.add('whitebox');document.getElementById('dataset').value=value;render();}
document.getElementById('dataset').onchange=e=>setDataset(e.target.value);
document.getElementById('reset').onclick=()=>{setDataset('normal');notify('처음 상태로 돌아왔습니다.');};
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{const width=b.dataset.width,canvas=document.getElementById('canvas');canvas.style.maxWidth=width==='full'?'':width+'px';canvas.dataset.preview=width;if(width!=='full'&&view==='compare')setView('a');document.querySelectorAll('[data-width]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));notify(width==='full'?'전체 너비로 표시합니다.':`${width}px 콘텐츠 너비 미리보기`);});
document.getElementById('inspect').onclick=e=>{inspect=!inspect;e.currentTarget.setAttribute('aria-pressed',String(inspect));document.getElementById('annotation').hidden=true;};
document.addEventListener('mousemove',e=>{const box=document.getElementById('annotation');if(!inspect||!e.target.closest('.sidebar')){box.hidden=true;return;}const s=getComputedStyle(e.target);box.textContent=`${Math.round(e.target.getBoundingClientRect().width)} × ${Math.round(e.target.getBoundingClientRect().height)}px · ${s.fontSize} / ${s.lineHeight} · ${s.color}`;box.hidden=false;box.style.left=Math.min(e.clientX+12,innerWidth-300)+'px';box.style.top=Math.min(e.clientY+18,innerHeight-65)+'px';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();return;}if(e.target.matches('input,textarea,select'))return;if(e.key==='/'){e.preventDefault();document.querySelector(`[data-search="${view==='compare'?'a':view}"]`)?.focus();}if(['ArrowDown','ArrowUp'].includes(e.key)&&e.target.matches('.project-select')){const buttons=[...e.target.closest('.project-list').querySelectorAll('.project-select')],index=buttons.indexOf(e.target);e.preventDefault();buttons[(index+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();}});
render();
</script>
</body>
</html>
